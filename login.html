<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Sale Calculator — Sign In</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #26262a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 44px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    text-align: center;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 2px;
    font-weight: 700;
    text-transform: uppercase;
    margin: 0 0 6px 0;
    color: #1a1a1a;
  }
  .subtitle {
    font-size: 13px;
    color: #2f6fed;
    margin: 0 0 28px 0;
  }
  label {
    display: block;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #1a1a1a;
    margin-bottom: 6px;
  }
  .field {
    margin-bottom: 20px;
  }
  select, input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #d5d5d8;
    border-radius: 8px;
    background: #fff;
    color: #1a1a1a;
  }
  select:focus, input[type="password"]:focus {
    outline: none;
    border-color: #14b8a6;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: #14b8a6;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover {
    background: #0f9c8c;
  }
  .error {
    color: #d33;
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>First Sale Calculator</h1>
  <p class="subtitle">Sign in to continue</p>

  <form id="loginForm">
    <div class="field">
      <label for="user">USER</label>
      <select id="user"></select>
    </div>

    <div class="field">
      <label for="password">PASSWORD</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>

    <button type="submit">Sign in</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script src="config.js"></script>
<script>
  // Populate the user dropdown from config.js
  const userSelect = document.getElementById("user");
  LOGIN_CREDENTIALS.forEach(cred => {
    const opt = document.createElement("option");
    opt.value = cred.username;
    opt.textContent = cred.username;
    userSelect.appendChild(opt);
  });

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const username = userSelect.value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");

    const match = LOGIN_CREDENTIALS.find(
      cred => cred.username === username && cred.password === password
    );

    if (match) {
      // Mark this browser session as authenticated, then continue on.
      sessionStorage.setItem("fpc_authed", "true");
      window.location.href = "index.html"; // change to your calculator's entry file if different
    } else {
      errorMsg.textContent = "Incorrect username or password.";
    }
  });
</script>

</body>
</html>
